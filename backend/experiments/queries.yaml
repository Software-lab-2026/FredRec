# Labelled queries for tuning the meaning-based (vector) search thresholds. Used by experiments/calibrate.py.
# Add a query whenever search gets one wrong, then re-run the calibration and record the result
# (docs/experiments/README.md).
#
# topic_matching: what a search should resolve to when it isn't an exact topic name or alias.
#   expect: the acceptable topic names (any of them counts as right), or [] if it should match nothing.
# scraped_items: whether a query has genuinely relevant scraped lectures/courses (NPTEL, MIT OCW, Teach Yourself CS).

topic_matching:
  # Paraphrases and sub-topics of covered topics
  - {query: "neural networks", expect: [Deep Learning, Machine Learning]}
  - {query: "backpropagation", expect: [Deep Learning, Machine Learning]}
  - {query: "transformers attention", expect: [Deep Learning, Natural Language Processing, Generative AI]}
  - {query: "large language models", expect: [Generative AI, Natural Language Processing]}
  - {query: "image classification", expect: [Computer Vision, Deep Learning]}
  - {query: "q learning", expect: [Reinforcement Learning]}
  - {query: "pandas dataframes", expect: [Data Analysis, Python]}
  - {query: "binary search tree", expect: [Trees, Sorting and Searching]}
  - {query: "shortest path algorithms", expect: [Graphs]}
  - {query: "hash tables", expect: [Hashing]}
  - {query: "priority queue", expect: [Heaps, Stacks and Queues]}
  - {query: "memoization", expect: [Dynamic Programming, Recursion]}
  - {query: "merge sort", expect: [Sorting and Searching]}
  - {query: "process scheduling", expect: [Operating Systems]}
  - {query: "virtual memory paging", expect: [Operating Systems, Computer Organization and Architecture]}
  - {query: "tcp ip protocol", expect: [Computer Networks]}
  - {query: "public key encryption", expect: [Cryptography, Network Security]}
  - {query: "sql joins tutorial", expect: [SQL, Database Management Systems]}
  - {query: "database normalization", expect: [Database Management Systems, SQL]}
  - {query: "mongodb", expect: [NoSQL]}
  - {query: "unit testing", expect: [Software Testing]}
  - {query: "version control", expect: [Git]}
  - {query: "react hooks", expect: [Frontend Frameworks]}
  - {query: "container orchestration", expect: [Kubernetes, Docker]}
  - {query: "consensus algorithms raft paxos", expect: [Distributed Systems]}
  - {query: "regular expressions automata", expect: [Theory of Computation]}
  - {query: "parsing and lexical analysis", expect: [Compiler Design]}
  - {query: "boolean algebra logic gates", expect: [Digital Logic]}
  - {query: "np completeness", expect: [Complexity Theory, Theory of Computation]}
  - {query: "eigenvalues and matrices", expect: [Linear Algebra for CS]}
  - {query: "bayes theorem", expect: [Probability and Statistics]}
  - {query: "classes and inheritance", expect: [Object-Oriented Programming]}
  # Known hard cases (wrong matches seen in testing)
  - {query: "mixture of experts routing", expect: [Machine Learning, Deep Learning, Generative AI]}
  - {query: "hyperparameter tuning bayesian", expect: [Machine Learning]}
  - {query: "how computers talk to each other", expect: [Computer Networks]}
  - {query: "federated learning privacy", expect: [Machine Learning, Deep Learning]}
  # Not Computer Science: should match nothing
  - {query: "sourdough baking", expect: []}
  - {query: "football scores", expect: []}
  - {query: "guitar chords", expect: []}
  - {query: "cooking pasta recipes", expect: []}
  - {query: "knitting patterns", expect: []}
  - {query: "stock market tips", expect: []}
  - {query: "gardening in winter", expect: []}
  - {query: "renaissance painting", expect: []}

scraped_items:
  - {query: "bias variance tradeoff", relevant: true}
  - {query: "dijkstra shortest path", relevant: true}
  - {query: "hashing", relevant: true}
  - {query: "tcp congestion control", relevant: true}
  - {query: "jacobian in neural networks", relevant: true}
  - {query: "page replacement algorithms", relevant: true}
  - {query: "convolutional neural networks", relevant: true}
  - {query: "b+ trees indexing", relevant: true}
  - {query: "context free grammars", relevant: true}
  - {query: "public key cryptography rsa", relevant: true}
  - {query: "sourdough baking", relevant: false}
  - {query: "football scores", relevant: false}
  - {query: "guitar chords", relevant: false}
  - {query: "gardening in winter", relevant: false}
  - {query: "renaissance painting", relevant: false}

# Held out: written after the topic descriptions (data/topic_descriptions.yaml) were frozen on 2026-11-22, in a
