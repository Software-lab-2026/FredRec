[project]
name = "fredrec-backend"
version = "0.1.0"
description = "FredRec API and database layer"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16",
  "argon2-cffi>=23.1",
  "beautifulsoup4>=4.12",
  "email-validator>=2.2",
  "fastapi>=0.115",
  "fastembed>=0.7",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pgvector>=0.4",
  "pyjwt>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "sqlalchemy[asyncio]>=2.1",
  "uvicorn>=0.32",
]


[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]


